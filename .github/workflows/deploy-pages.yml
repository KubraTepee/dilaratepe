name: GitHub Pages'e yayınla

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Statik site dosyalarını hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ConsoleApp1/wwwroot

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
